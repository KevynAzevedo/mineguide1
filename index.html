<!DOCTYPE html>
<html>
<head>
  <style>
    body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; }
    .btn { display: inline-block; padding: 12px 20px; margin: 10px; background: #333; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .btn:hover { background: #555; }
    img { max-width: 80%; border: 2px solid #444; margin-top: 20px; }
  </style>
</head>
<body>

  <h1>Guia de Portas Lógicas 1</h1>
  
  <div>
    <!-- Substitua os links pelas URLs RAW das suas imagens -->
    <a class="btn" href="https://github.com/KevynAzevedo/mineguide1/blob/main/1.png?raw=true">Pag 1</a>
    <a class="btn" href="https://raw.githubusercontent.com/KevynAzevedo/mineguide1/refs/heads/main/2.png">Pag 2</a>
    <a class="btn" href="https://github.com/KevynAzevedo/mineguide1/blob/main/3.png?raw=true">Pag 3</a>
    <a class="btn" href="https://github.com/KevynAzevedo/mineguide1/blob/main/4.png?raw=true">Pag 4</a>
  </div>

  <hr>

  <!-- Espaço onde a imagem vai aparecer -->
  <div id="conteudo">
    <p>Selecione uma página acima para visualizar.</p>
  </div>

  <script>
    // Script básico para carregar a imagem selecionada
    const params = new URLSearchParams(window.location.search);
    const img = params.get('img');
    
    // Mapeie os nomes para os seus links RAW reais do GitHub
    const imagens = {
      '1': 'https://github.com/KevynAzevedo/mineguide1/blob/main/1.png?raw=true',
      '2':  'https://raw.githubusercontent.com/KevynAzevedo/mineguide1/refs/heads/main/2.png',
      '3': 'https://github.com/KevynAzevedo/mineguide1/blob/main/3.png?raw=true'
      '4': 'https://github.com/KevynAzevedo/mineguide1/blob/main/4.png?raw=true'
    };

    if (img && imagens[img]) {
      document.getElementById('conteudo').innerHTML = '<img src="' + imagens[img] + '">';
    }
  </script>

</body>
</html>
