<!DOCTYPE html>
<html>
<head>
  <style>
    body { background-color: #121212; color: white; font-family: sans-serif; text-align: center; }
    .btn { display: inline-block; padding: 12px 20px; margin: 10px; background: #333; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; }
    .btn:hover { background: #555; }
    img { max-width: 80%; border: 2px solid #444; margin-top: 20px; }
  </style>
</head>
<body>

  <h1>Guia de Portas Lógicas</h1>
  
  <div>
    <!-- Substitua os links pelas URLs RAW das suas imagens -->
    <a class="btn" href="?img=and">Porta AND</a>
    <a class="btn" href="?img=or">Porta OR</a>
    <a class="btn" href="?img=not">Porta NOT</a>
  </div>

  <hr>

  <!-- Espaço onde a imagem vai aparecer -->
  <div id="conteudo">
    <p>Selecione uma porta lógica acima para visualizar.</p>
  </div>

  <script>
    // Script básico para carregar a imagem selecionada
    const params = new URLSearchParams(window.location.search);
    const img = params.get('img');
    
    // Mapeie os nomes para os seus links RAW reais do GitHub
    const imagens = {
      'and': 'https://raw.githubusercontent.com/seu-usuario/seu-repo/main/and.png',
      'or':  'https://raw.githubusercontent.com/seu-usuario/seu-repo/main/or.png',
      'not': 'https://raw.githubusercontent.com/seu-usuario/seu-repo/main/not.png'
    };

    if (img && imagens[img]) {
      document.getElementById('conteudo').innerHTML = '<img src="' + imagens[img] + '">';
    }
  </script>

</body>
</html>
